<div class="subscribe__container container">
  <div class="subscribe__card">
    <div class="subscribe__intro">
      <p class="subscribe__eyebrow eyebrow">актуально</p>
      <h2 class="subscribe__title">Получайте полезные рассылки о путешествиях</h2>
    </div>

    <form class="subscribe__form">
      <label class="subscribe__label" for="subscribe-email">Введите e-mail адрес</label>

      <div class="subscribe__row">
        <input
          class="subscribe__input"
          id="subscribe-email"
          type="email"
          name="email"
          placeholder="name@domain.com"
        />

        <button class="subscribe__button button" type="submit">Подписаться на новости</button>
      </div>

      <p class="subscribe__note">
        подписываясь на новости, вы автоматически соглашаетесь с
        <a href="#">условиями обработки персональных данных</a> и
        <a href="#">правилами рекламных рассылок</a>
      </p>
    </form>
  </div>
</div>
